# Push a main → imagen + Cloud Run Job + Cloud Scheduler cada 4 h.
# El secreto FRAX_API_KEY se adjunta al job; no va en este YAML.

substitutions:
  _REGION: southamerica-west1
  _SCHEDULER_REGION: us-east1
  _JOB: carga-marcas-mariadb
  _SCHEDULER: carga-marcas-mariadb-schedule
  _JOB_PERSONAS: carga-personas-frax
  _SCHEDULER_PERSONAS: carga-personas-frax-schedule
  _SA: cargar-cr@worldwide-470917.iam.gserviceaccount.com
  _IMAGE: gcr.io/worldwide-470917/carga-marcas-mariadb
  _ENV_BASE: 'GCP_PROJECT_ID=worldwide-470917,BQ_DATASET=cr_reportes,BQ_TABLE=marcas_mariadb,BQ_TABLE_PERSONAS=personas_frax,BQ_WRITE_DISPOSITION=WRITE_TRUNCATE,FRAX_API_BASE=https://frax.controltienda.com/api/v1,FRAX_API_BASE_FALLBACK=https://frax2.controltienda.com/api/v1,FRAX_DESDE=2024-08-01'
  _SECRETS: 'FRAX_API_KEY=carga-marcas-frax-api-key:latest'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:$BUILD_ID'
      - '-t'
      - '${_IMAGE}:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    args: ['push', '${_IMAGE}:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args: ['push', '${_IMAGE}:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-job'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REGION="${_REGION}"
        IMAGE="${_IMAGE}:$BUILD_ID"
        ENV_VARS="${_ENV_BASE}"
        SECRETS="${_SECRETS}"
        SA="${_SA}"

        deploy() {
          local name="$$1"
          local args="$$2"
          local verb="update"
          if ! gcloud run jobs describe "$$name" --region "$$REGION" >/dev/null 2>&1; then
            verb="create"
          fi
          echo "$$verb job $$name"
          gcloud run jobs "$$verb" "$$name" \
            --image="$$IMAGE" \
            --region="$$REGION" \
            --service-account="$$SA" \
            --task-timeout=3600 \
            --memory=2Gi \
            --cpu=1 \
            --max-retries=1 \
            --args="$$args" \
            --set-env-vars="$$ENV_VARS" \
            --set-secrets="$$SECRETS"
        }

        deploy "${_JOB}" "python,main.py,sync"
        deploy "${_JOB_PERSONAS}" "python,main.py,sync-personas"

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REGION="${_REGION}"
        SCHEDULER_REGION="${_SCHEDULER_REGION}"
        SA="${_SA}"

        upsert_scheduler() {
          local sch="$$1"
          local job="$$2"
          local schedule="$$3"
          local description="$$4"
          local uri="https://$${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/worldwide-470917/jobs/$${job}:run"
          local verb="update"
          if ! gcloud scheduler jobs describe "$$sch" --location="$$SCHEDULER_REGION" >/dev/null 2>&1; then
            verb="create"
          fi
          echo "$$verb scheduler $$sch"
          gcloud scheduler jobs "$$verb" http "$$sch" \
            --location="$$SCHEDULER_REGION" \
            --schedule="$$schedule" \
            --time-zone="America/Santiago" \
            --uri="$$uri" \
            --http-method=POST \
            --oauth-service-account-email="$$SA" \
            --attempt-deadline=1800s \
            --description="$$description"
        }

        upsert_scheduler "${_SCHEDULER}" "${_JOB}" "0 */4 * * *" "API FRAX marcas -> BigQuery marcas_mariadb cada 4 h"
        upsert_scheduler "${_SCHEDULER_PERSONAS}" "${_JOB_PERSONAS}" "0 8 * * *" "API FRAX personas -> BigQuery personas_frax todos los dias a las 8:00"
    waitFor: ['deploy-job']

images:
  - '${_IMAGE}:$BUILD_ID'
  - '${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

timeout: '1800s'
